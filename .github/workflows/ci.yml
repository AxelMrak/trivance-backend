name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trivance_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trivance_db_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test env
        run: printf 'NODE_ENV=test\nDATABASE_URL=postgres://postgres@localhost:5432/trivance_db_test\n' > .env.test

      - name: Run migrations
        run: npm run migrate:test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/trivance_db_test

      - name: Lint and typecheck
        run: npm run lint:check && npm run typecheck

      - name: Run tests
        run: npm run test:ci
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/trivance_db_test
