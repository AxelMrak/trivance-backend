name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trivance_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trivance_db_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create app role
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d trivance_db_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trivance_app') THEN CREATE ROLE trivance_app LOGIN PASSWORD 'trivance_app_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE; END IF; END $$;
          GRANT USAGE ON SCHEMA public TO trivance_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO trivance_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO trivance_app;
          SQL

      - name: Prepare test env
        run: printf 'NODE_ENV=test\nDATABASE_URL=postgres://trivance_app:trivance_app_dev@localhost:5432/trivance_db_test\n' > .env.test

      - name: Run migrations
        run: npm run migrate:test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/trivance_db_test

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Run tests
        run: npm run test:ci
        env:
          DATABASE_URL: postgres://trivance_app:trivance_app_dev@localhost:5432/trivance_db_test
