services:
  trivance-db-test:
    image: postgres:13
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-trivance_db_test}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${TEST_DB_NAME:-trivance_db_test}"]
      interval: 2s
      timeout: 5s
      retries: 15
